<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SXOPOP — Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:#eef0f7;color:#1a1a2e}nav{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 2px 10px #0001}nav img{height:34px;max-width:160px;object-fit:contain}.out{border:2px solid #e0e0ef;background:#fff;border-radius:9px;padding:8px 13px;font-weight:700;color:#6b7280}.wrap{max-width:900px;margin:auto;padding:24px 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border-radius:15px;padding:18px;box-shadow:0 4px 24px #3d1a8e12}.label{font-size:12px;color:#6b7280;font-weight:800}.num{font-size:28px;font-weight:800;color:#5b2fcf;margin-top:4px}.box,.table{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 24px #3d1a8e12;margin-bottom:18px}h2{font-size:17px;margin:0 0 14px}.row{display:flex;gap:10px}.row input{flex:1;padding:13px;border:2px solid #e0e0ef;border-radius:11px;font-size:15px}.btn{padding:13px 20px;border:0;border-radius:11px;background:#5b2fcf;color:#fff;font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e0e0ef;font-size:13px}th{color:#6b7280}@media(max-width:600px){.stats{grid-template-columns:1fr}.row{flex-direction:column}.btn{width:100%}}</style></head><body><nav><a href="/"><img src="/wordmark.png" alt="SXOPOP"></a><button class="out" onclick="logout()">Logout</button></nav><div class="wrap"><div class="stats"><div class="stat"><div class="label">LINKS</div><div id="count" class="num">0</div></div><div class="stat"><div class="label">CLICKS</div><div id="clicks" class="num">0</div></div><div class="stat"><div class="label">ACCOUNT</div><div id="account" class="num">—</div></div></div><section class="box"><h2>Create a short link</h2><div class="row"><input id="url" type="url" placeholder="https://example.com" required><button class="btn" onclick="shorten()">Shorten</button></div><p id="msg"></p></section><section class="table"><h2>Your recent links</h2><table><thead><tr><th>Short link</th><th>Destination</th><th>Clicks</th></tr></thead><tbody id="list"><tr><td colspan="3">Loading…</td></tr></tbody></table></section></div><script>const u=JSON.parse(localStorage.getItem('sxopop_user')||'null');if(!u)location.href='/login.html';account.textContent=u?.email?.split('@')[0]||'User';async function load(){const r=await fetch('/api/links?user_id='+encodeURIComponent(u.id));const d=await r.json();const a=d.links||[];count.textContent=a.length;clicks.textContent=a.reduce((s,x)=>s+(x.clicks||0),0);list.innerHTML=a.length?a.map(x=>`<tr><td><a href="${x.short_url}" target="_blank">${x.short_url}</a></td><td title="${x.original_url}">${x.original_url.slice(0,42)}${x.original_url.length>42?'…':''}</td><td>${x.clicks||0}</td></tr>`).join(''):'<tr><td colspan="3">No links yet.</td></tr>'}async function shorten(){const v=url.value.trim();if(!v)return;msg.textContent='Creating…';const r=await fetch('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v,user_id:u.id,expiry_days:7})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Failed';return}msg.innerHTML=`Created: <a href="${d.short_url}" target="_blank">${d.short_url}</a>`;url.value='';load()}function logout(){localStorage.removeItem('sxopop_user');location.href='/'}load();</script></body></html>
