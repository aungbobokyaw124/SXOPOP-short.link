<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SXOPOP — Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:#eef0f7;color:#1a1a2e;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 40px #3d1a8e18}.logo{height:44px;display:block;margin:0 auto 18px}.h{font-size:26px;font-weight:800;text-align:center}.p{text-align:center;color:#6b7280}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:2px solid #e0e0ef;border-radius:11px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#5b2fcf;color:#fff;font-size:16px;font-weight:800}.msg{margin-top:12px;text-align:center;color:#dc2626}.back{text-align:center;margin-top:18px}.back a{color:#5b2fcf;text-decoration:none;font-weight:700}</style></head><body><main class="card"><img class="logo" src="/wordmark.png" alt="SXOPOP"><div class="h">Welcome back</div><p class="p">Login to manage your short links.</p><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Login</button><div id="msg" class="msg"></div></form><div class="back"><a href="/">← Back to SXOPOP</a></div></main><script>const f=document.querySelector('#f'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');localStorage.setItem('sxopop_user',JSON.stringify(d.user));location.href='/dashboard.html'}catch(x){m.textContent=x.message}}</script></body></html>
